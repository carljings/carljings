<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Xiao Chuan</title>
  <desc id="desc">A blue paper plane, a golden sun and a light flight trail on a dark background. Success lies in accumulation.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#10263A"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E6F8FF"/>
      <stop offset="1" stop-color="#88CFEA"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1D3A4E" stop-opacity="0"/>
      <stop offset="1" stop-color="#72B9D9"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2B4B60"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="208" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="1" y="1" width="1198" height="208" fill="#0D1117"/>
    <path d="M689 210C771 114 815 20 942 0H1200V210Z" fill="url(#sky)"/>
    <rect x="815" y="16" width="366" height="180" fill="url(#dots)" opacity=".6"/>
    <circle cx="1027" cy="98" r="113" fill="none" stroke="#1D3A4E" stroke-width="1"/>
    <circle cx="1027" cy="98" r="87" fill="none" stroke="#142C3B" stroke-width="12"/>
    <path d="M641 173H810M702 152H851M752 130H883" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
    <path d="M686 191C735 156 778 196 807 162S795 123 781 141C767 162 835 174 893 128" fill="none" stroke="#4A86A3" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round"/>
    <g fill="none" stroke="#E7B844" stroke-width="3" stroke-linecap="round">
      <circle cx="1085" cy="47" r="16" fill="#FFE7A0" stroke="none"/>
      <path d="M1085 18V11M1085 83V76M1056 47H1049M1121 47H1114M1064 26L1059 21M1106 68L1111 73M1064 68L1059 73M1106 26L1111 21"/>
    </g>
    <g stroke="#33536A" stroke-width="2.8" stroke-linejoin="round">
      <path d="M863 93L1104 69L948 184L931 123Z" fill="#FFFFFF"/>
      <path d="M931 123L1104 69L969 144L948 184Z" fill="url(#wing)"/>
      <path d="M969 144L1030 169L1104 69Z" fill="#DFF3FC"/>
      <path d="M863 93L931 123L1104 69Z" fill="#FFFFFF"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="43" y="48" font-size="23" fill="#8FA9BA">Hi, I'm</text>
      <text x="40" y="121" font-size="69" font-weight="750" letter-spacing="-2.5" fill="#E6EDF3">Xiao Chuan<tspan fill="#5CAACB">.</tspan></text>
      <rect x="44" y="158" width="26" height="3" rx="1.5" fill="#E7B844"/>
      <text x="83" y="166" font-size="21" fill="#8FA9BA">Success lies in accumulation.</text>
      <text x="1160" y="188" font-size="10" letter-spacing="2" fill="#6E8797" text-anchor="end">CARLJINGS</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="208" rx="18" fill="none" stroke="#30363D"/>
</svg>
